name: View security_invoker Guard

on:
  pull_request:
    paths:
      - "docker/postgres-init/**"
  push:
    branches: [main]
    paths:
      - "docker/postgres-init/**"

permissions:
  contents: read

jobs:
  view-security-invoker-guard:
    name: View security_invoker Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No continue-on-error: a gate that cannot fail is not a gate.
      - name: Fail if a migration view lacks security_invoker coverage
        run: bash .github/scripts/view-security-invoker-guard.sh
