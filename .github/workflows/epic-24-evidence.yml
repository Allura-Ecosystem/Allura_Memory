name: Epic 24 Evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: epic-24-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  ARTIFACT_RETENTION_DAYS: "14"
  CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  epic24-static:
    name: Epic 24 Evidence / Static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          bun run ci:evidence run \
            --lane=static \
            --name=typecheck \
            --artifact-dir="artifacts/ci/${GITHUB_SHA}/static" \
            -- bun run typecheck
      - name: ESLint
        if: ${{ always() }}
        env:
          CI_LINT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          bun run ci:evidence run \
            --lane=static \
            --name=eslint-changed-files \
            --artifact-dir="artifacts/ci/${GITHUB_SHA}/static" \
            -- bun run lint:ci --base="${CI_LINT_BASE_SHA}"
      # Story 24.11a AC-6 — blocking route-authority gate.
      # Fails the job when a route handler under src/app is absent from
      # src/lib/auth/route-scope-manifest.ts, or when a manifest entry declares
      # a role weaker than the role its handler enforces on every method.
      # The route count is emitted as a commit-bound artifact
      # (artifacts/ci/<sha>/static/route-scope-manifest.json).
      - name: Route-scope manifest authority
        if: ${{ always() }}
        run: |
          bun run ci:evidence run \
            --lane=static \
            --name=route-scope-manifest \
            --artifact-dir="artifacts/ci/${GITHUB_SHA}/static" \
            --artifact="artifacts/ci/${GITHUB_SHA}/static/route-scope-manifest.json" \
            -- bun run validate:route-scope-manifest \
              --json="artifacts/ci/${GITHUB_SHA}/static/route-scope-manifest.json"
      - name: Upload static evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-24-evidence-static-${{ github.sha }}
          path: artifacts/ci/${{ github.sha }}/static
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  epic24-unit:
    name: Epic 24 Evidence / Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: |
          bun run ci:evidence run \
            --lane=unit \
            --name=unit-tests \
            --artifact-dir="artifacts/ci/${GITHUB_SHA}/unit" \
            --artifact="artifacts/ci/${GITHUB_SHA}/unit/unit-tests.json" \
            --require-vitest-results="artifacts/ci/${GITHUB_SHA}/unit/unit-tests.json" \
            -- bun vitest run --config vitest.config.unit.ts --reporter=json \
              --outputFile="artifacts/ci/${GITHUB_SHA}/unit/unit-tests.json"
      - name: Upload unit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-24-evidence-unit-${{ github.sha }}
          path: artifacts/ci/${{ github.sha }}/unit
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  epic24-build:
    name: Epic 24 Evidence / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: |
          bun run ci:evidence run \
            --lane=build \
            --name=production-build \
            --artifact-dir="artifacts/ci/${GITHUB_SHA}/build" \
            -- bun run build
      - name: Upload build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-24-evidence-build-${{ github.sha }}
          path: artifacts/ci/${{ github.sha }}/build
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  epic24-live-db:
    name: Epic 24 Evidence / Live PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: memory
      POSTGRES_USER: allura
      POSTGRES_PASSWORD: allura-ci-password
      POSTGRES_APP_USER: allura_app
      POSTGRES_APP_PASSWORD: change-me-in-production
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: memory
          POSTGRES_USER: allura
          POSTGRES_PASSWORD: allura-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=allura --dbname=memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Historical-upgrade proof reads a pinned pre-57 migration commit.
          fetch-depth: 0
      - name: Fetch pinned historical upgrade baseline
        run: git fetch --no-tags origin dcd2bb25c8b56678451aa7846f2ead1328d3d4b5
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply migrations and run live database tests
        run: |
          bun run ci:evidence run \
            --lane=live-db \
            --name=live-postgresql-integration \
            --artifact-dir="artifacts/ci/${GITHUB_SHA}/live-db" \
            --artifact="artifacts/ci/${GITHUB_SHA}/live-db/migration.log" \
            --artifact="artifacts/ci/${GITHUB_SHA}/live-db/live-db-tests.json" \
            --artifact="artifacts/ci/${GITHUB_SHA}/live-db/postgres-server-version.txt" \
            --postgres-server-version-file="artifacts/ci/${GITHUB_SHA}/live-db/postgres-server-version.txt" \
            --require-vitest-results="artifacts/ci/${GITHUB_SHA}/live-db/live-db-tests.json" \
            -- bash scripts/ci/run-live-db-tests.sh \
              --artifact-dir="artifacts/ci/${GITHUB_SHA}/live-db"
      - name: Upload live database evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-24-evidence-live-db-${{ github.sha }}
          path: artifacts/ci/${{ github.sha }}/live-db
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  epic24-benchmark:
    name: Epic 24 Evidence / Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: memory
      POSTGRES_USER: allura
      POSTGRES_PASSWORD: allura-ci-password
      POSTGRES_APP_USER: allura_app
      POSTGRES_APP_PASSWORD: change-me-in-production
      GRAPH_BACKEND: ruvector
      PROMOTION_MODE: soc2
      RUVECTOR_EMBEDDING_BASE_URL: http://127.0.0.1:9
      RUVIX_CONTROL_PLANE_SECRET: allura-ci-controlPlane-secret-at-least-32-characters
      ALLURA_MCP_TOKEN_SECRET: allura-ci-token-secret
      ALLURA_RATE_LIMIT_ENABLED: "false"
      ALLURA_MCP_HTTP_PORT: "6477"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: memory
          POSTGRES_USER: allura
          POSTGRES_PASSWORD: allura-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=allura --dbname=memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run complete benchmark baseline
        run: |
          bun run ci:evidence run \
            --lane=benchmark \
            --name=benchmark-baseline \
            --artifact-dir="artifacts/ci/${GITHUB_SHA}/benchmark" \
            --artifact="artifacts/ci/${GITHUB_SHA}/benchmark/benchmark-results.json" \
            --artifact="artifacts/ci/${GITHUB_SHA}/benchmark/gateway.log" \
            --artifact="artifacts/ci/${GITHUB_SHA}/benchmark/database/migration.log" \
            --artifact="artifacts/ci/${GITHUB_SHA}/benchmark/database/postgres-server-version.txt" \
            --postgres-server-version-file="artifacts/ci/${GITHUB_SHA}/benchmark/database/postgres-server-version.txt" \
            --require-benchmark-results="artifacts/ci/${GITHUB_SHA}/benchmark/benchmark-results.json" \
            --expected-benchmark-ids=retrieval-quality,curation-accuracy,governance-integrity,latency-profile,audit-completeness \
            -- bash scripts/ci/run-benchmark.sh \
              --artifact-dir="artifacts/ci/${GITHUB_SHA}/benchmark"
      - name: Upload benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-24-evidence-benchmark-${{ github.sha }}
          path: artifacts/ci/${{ github.sha }}/benchmark
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  epic24-eval:
    name: Epic 24 Evidence / Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run portfolio evaluation suite
        run: |
          bun run ci:evidence run \
            --lane=eval \
            --name=portfolio-evaluation \
            --artifact-dir="artifacts/ci/${GITHUB_SHA}/eval" \
            --artifact="artifacts/ci/${GITHUB_SHA}/eval/portfolio.json" \
            --artifact="artifacts/ci/${GITHUB_SHA}/eval/portfolio.md" \
            -- bun run eval:portfolio \
              --json="artifacts/ci/${GITHUB_SHA}/eval/portfolio.json" \
              --md="artifacts/ci/${GITHUB_SHA}/eval/portfolio.md"
      - name: Upload evaluation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-24-evidence-eval-${{ github.sha }}
          path: artifacts/ci/${{ github.sha }}/eval
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  epic24-aggregate:
    name: Epic 24 Evidence / Aggregate
    if: ${{ always() }}
    needs: [epic24-static, epic24-unit, epic24-build, epic24-live-db, epic24-benchmark, epic24-eval]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Download lane evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: epic-24-evidence-*-${{ github.sha }}
          path: artifacts/download
      - name: Aggregate and validate the SHA-bound manifest
        if: ${{ always() }}
        run: |
          bun run ci:evidence aggregate \
            --input-dir=artifacts/download \
            --output="artifacts/ci/${GITHUB_SHA}/evidence/evidence-manifest.json" \
            --schema=docs/portfolio/evidence-schema.json \
            --expected-lanes=static,unit,build,live-db,benchmark,eval
      - name: Upload aggregate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: epic-24-evidence-manifest-${{ github.sha }}
          path: artifacts/ci/${{ github.sha }}/evidence
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
