name: MCP Testing Suite

on:
  push:
    branches: [main, develop, new-main]
  pull_request:
    branches: [main, develop, new-main]

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: static-analysis
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:unit

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  mcp-browser-tests:
    name: MCP Runtime Health Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Start application
        env:
          ALLURA_DASHBOARD_PORT: "3100"
        run: |
          bun run start &
          echo "Waiting for app on port 3100..."
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3100/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy within 60 seconds" >&2
          exit 1

      - name: Run MCP runtime health tests
        env:
          ALLURA_DASHBOARD_PORT: "3100"
          NEXT_PUBLIC_APP_URL: http://localhost:3100
        run: bun run test:mcp:browser

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, mcp-browser-tests]
    if: always()
    steps:
      - name: Test Results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP Runtime Health Tests | ${{ needs.mcp-browser-tests.result }} |" >> $GITHUB_STEP_SUMMARY
