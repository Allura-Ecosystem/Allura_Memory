name: Check

on:
  push:
    branches:
      - main
      - master
      - develop
      - new-main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Scan device-pairing credential artifacts (Story 29.17 / AC-25)
        run: bun run scan:credentials

      - name: Lint check
        run: bun run lint
      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test:integration
