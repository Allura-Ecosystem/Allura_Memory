name: Check

on:
  push:
    branches:
      - main
      - master
      - develop
      - new-main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint check
        run: bun run lint
      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test:integration

  epic30-hermetic:
    if: github.event_name == 'workflow_dispatch'
    name: Epic 30 / Hermetic authorization and UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test:epic30-hermetic

  epic30-confined-postgres-http:
    if: github.event_name == 'workflow_dispatch'
    name: Epic 30 / Confined PostgreSQL and HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5444"
      POSTGRES_DB: memory
      POSTGRES_USER: allura
      POSTGRES_PASSWORD: allura-ci-password
      POSTGRES_APP_USER: allura_app
      POSTGRES_APP_PASSWORD: change-me-in-production
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: memory
          POSTGRES_USER: allura
          POSTGRES_PASSWORD: allura-ci-password
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready --username=allura --dbname=memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test:epic30-live
