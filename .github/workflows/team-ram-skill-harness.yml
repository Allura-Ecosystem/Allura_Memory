name: Team RAM Skill Harness

on:
  pull_request:
    paths:
      - ".opencode/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "opencode.json"
      - "package.json"
      - "scripts/team-ram-skill-harness.ts"
      - ".github/workflows/team-ram-skill-harness.yml"
  push:
    branches: [main]
    paths:
      - ".opencode/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "opencode.json"
      - "package.json"
      - "scripts/team-ram-skill-harness.ts"
      - ".github/workflows/team-ram-skill-harness.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run skills:validate
