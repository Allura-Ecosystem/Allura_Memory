name: Epic 30 confined evidence

on:
  pull_request:
    paths:
      - ".github/workflows/epic-30-evidence.yml"
      - "docker/epic30-postgres/**"
      - "docker/postgres-init/**"
      - "scripts/epic30/**"
      - "scripts/ci/run-epic30-live-tests.sh"
      - "src/app/dashboard/**"
      - "src/components/dashboard/**"
      - "src/lib/digital-brain/**"
      - "package.json"
      - "vitest.config.epic30-live.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confined-postgres-http:
    name: Confined PostgreSQL and HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5444"
      POSTGRES_DB: memory
      POSTGRES_USER: allura
      POSTGRES_PASSWORD: allura-ci-password
      POSTGRES_APP_USER: allura_app
      POSTGRES_APP_PASSWORD: change-me-in-production
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: memory
          POSTGRES_USER: allura
          POSTGRES_PASSWORD: allura-ci-password
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready --username=allura --dbname=memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Run confined isolation and HTTP checks
        run: bun run test:epic30-live
