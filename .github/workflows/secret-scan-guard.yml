name: Secret Scan Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan-guard:
    name: Secret Scan Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No continue-on-error: a gate that cannot fail is not a gate.
      - name: Fail if a credential is committed to the tracked tree
        run: bash .github/scripts/secret-scan-guard.sh
