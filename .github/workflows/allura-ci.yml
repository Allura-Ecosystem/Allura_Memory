name: Allura exact-revision CI
on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: allura-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authoritative:
    name: Exact revision / all required lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Execute this source and attempt only
        id: execute
        working-directory: foundation
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          ALLURA_CI_OUTPUT: ${{ runner.temp }}/allura-ci
          TMPDIR: ${{ runner.temp }}
        run: bun scripts/ci.ts "$EXPECTED_SOURCE_SHA"
      - name: Preserve same-attempt evidence even on failure
        if: always() && steps.execute.outputs.artifact_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allura-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.execute.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
