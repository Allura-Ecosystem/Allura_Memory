# =============================================================================
# PRIMARY docker-compose.yml — Allura Brain (v2.2.0) — env-standard edition
# =============================================================================
# Changes in v2.2.0:
#   - Added explicit .env file loading for MCP containers (fixes credential drift)
#   - Standardized env_file pattern across all services
#   - MCP server now properly loads .env then .env.local for file precedence
#   - Pinned all environment configuration for reproducibility
# =============================================================================
# Other compose files in this repo:
#   docker/docker-compose.yml              — DEPRECATED (legacy sandbox, do not use)
#   docker-compose.enterprise.yml         — enterprise/multi-tenant overlay only
#   archive/sovereign-memory-mvp/*        — archived MVP, historical reference only
#
# To start the full stack (with secrets from .env.local):
#   docker compose --env-file .env --env-file .env.local up -d
# To check service health:
#   docker compose ps
# To rebuild all containers with current env:
#   docker compose --env-file .env --env-file .env.local build --no-cache
# To restart containers and reload env:
#   docker compose --env-file .env --env-file .env.local restart mcp && docker compose --env-file .env --env-file .env.local logs -f mcp

# =============================================================================
# Environment Variable Standardization (v2.2.0)
# =============================================================================
# This compose file uses a consistent pattern for environment configuration:
#
# 1. env_file: .env        — Base configuration (commit to git safely)
# 2. env_file: .env.local  — Local secrets/overrides (NOT in git)
#    - .env.local is intentionally .gitignored (see .gitignore)
#    - It takes precedence: values in .env.local override .env
#
# IMPORTANT: Docker Compose reads .env for YAML ${VAR} substitution by default.
# .env.local is NOT automatically read for YAML interpolation — only for
# container runtime via env_file directives. To get secrets into YAML
# substitution, you MUST use: docker compose --env-file .env --env-file .env.local
#
# MCP Container Loading Order:
#   1. .env (base config from repo)
#   2. .env.local (local overrides with secrets)
#   3. Explicit environment variables override both
#
# Why this matters:
#   - .env.local can hold local PG password and Neo4j credential overrides
#   - Docker builds with --no-cache ensure env_file paths are current
#   - Container restarts trigger env_file re-evaluation
#
# To verify env loading in MCP container:
#   docker compose --env-file .env --env-file .env.local exec mcp env | grep -E '(POSTGRES|NEO4J|OLLAMA|RUVIX)'
#
# To verify secrets are NOT in .env (committed file):
#   grep -E '(PASSWORD|SECRET|API_KEY)' .env  # Should only show placeholders
#
# To rebuild with current env (critical after .env changes):
#   docker compose down
#   docker compose build --no-cache
#   docker compose up -d
# =============================================================================
# =============================================================================

services:
  # PostgreSQL 16 — Primary database (events, traces, pgvector embeddings)
  # Temporary image tag: pgvector:pg16. Verify extversion at runtime before HNSW migration.
  # This matches the existing volume's data version and prevents auto-upgrade to PG17
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Loopback only — LAN access goes through the governed Brain gateway (:5888),
      # never direct DB. Internal consumers use the docker network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Neo4j REMOVED 2026-07-17 — AD-49 executed. GRAPH_BACKEND=ruvector (PostgreSQL).
  # Semantic graph now lives in graph_memories + graph_supersedes tables.
  # Backup at ~/backups/neo4j-sunset-2026-07-17/

  # Web frontend (Next.js)
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: allura-memory-mcp
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - .env.local
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=knowledge-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - RUVECTOR_HOST=knowledge-postgres
      - RUVECTOR_PORT=5432
      - RUVECTOR_USER=${POSTGRES_USER}
      - RUVECTOR_DB=${POSTGRES_DB}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_CLOUD_URL=${OLLAMA_CLOUD_URL:-https://ollama.com}
      - RUVECTOR_EMBEDDING_BASE_URL=http://host.docker.internal:11434
      - GRAPH_BACKEND=ruvector
      - DEFAULT_GROUP_ID=${DEFAULT_GROUP_ID:-allura-system}
      - RUVIX_KERNEL_SECRET=${RUVIX_KERNEL_SECRET:-}
      - ALLURA_MCP_HTTP_PORT=3201
      - ALLURA_MCP_HTTP_ENABLED=true
      - ALLURA_RATE_LIMIT_ENABLED=false
      # Budget circuit breaker tuning for agent memory writes.
      # Prevents long-lived Brooks sessions from halting on timeMs during normal work.
      - BUDGET_MAX_TIME_MS=${BUDGET_MAX_TIME_MS:-604800000}
      - BUDGET_MAX_STEPS=${BUDGET_MAX_STEPS:-5000}
      - BUDGET_MAX_RPM=${BUDGET_MAX_RPM:-120}
      - BUDGET_MAX_TOKENS_PER_HOUR=${BUDGET_MAX_TOKENS_PER_HOUR:-500000}
      - BUDGET_MAX_COST_USD=${BUDGET_MAX_COST_USD:-250.0}
    ports:
      - "5888:3201"
    command: ["bun", "run", "src/mcp/canonical-http-gateway.ts"]
    networks:
      - knowledge-network
      - open-webui-stack_default
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3201/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Allura Memory Dashboard — SUNSET 2026-06-20 (decision trace 279eaff2).
  # The Next.js web dashboard (port 3100) was removed: ~85% static shells, no
  # value. Human surface is now the curator CLI (`bun run curator:approve`) and
  # the Allura Brain MCP tools (allura-brain__memory_* incl. memory_promote).
  # The brain (allura-memory-mcp on 5888), Postgres, Neo4j, and curator are
  # unaffected. To restore: `git revert`/`git checkout` this file + src/app/dashboard.
  # =============================================================================

  # Notion: remote MCP only (mcp__claude_ai_Notion__*). No local service needed.

# =============================================================================
# Volume + Network Definitions — WHY external:true, and WHERE bootstrap happens
# =============================================================================
# The network (knowledge-network) and volumes (memory_postgres_data, neo4j_data,
# neo4j_logs) are declared `external: true` on purpose. This pins them to fixed,
# unprefixed names so the LIVE stack on the primary machine keeps binding the
# exact same data no matter which compose project name is used. If these were
# compose-managed, `docker compose -p <anything> up` would create fresh empty
# `<project>_postgres_data` volumes and silently abandon the real data. DO NOT
# change these to compose-managed volumes — that would orphan production data.
#
# TRADE-OFF: on a FRESH machine these externals do not exist yet, so a naive
# `docker compose up` fails before any container starts:
#     network knowledge-network declared as external, but could not be found
#     volume memory_postgres_data declared as external, but could not be found
#
# WHERE THE FIX LIVES: bootstrap is centralized in scripts/brain-stack.sh
# (bootstrap_external_resources), invoked by `bun run brain:up` and
# `bun run brain:recover`. It idempotently `docker network create` /
# `docker volume create`s these exact names BEFORE `compose up`, and always
# passes `--env-file .env --env-file .env.local`. On this machine every create
# is a no-op (they exist); on a fresh machine it makes `brain:up` truly
# one-command. Ref: 2026-07-02 fresh-deploy verdict, G1/G2/G4 —
# docs/archive/allura/INSTALL-DEPLOY-REVIEW.md. (scripts/first-run.sh does the
# same and remains as a standalone entrypoint.)
#
# KNOWN LIMITATION (G3, deferred): each service pins a hardcoded container_name
# (knowledge-postgres, knowledge-neo4j, allura-neo4j-init, allura-memory-mcp).
# The live stack and scripts/brain-stack.sh reference these names, so
# side-by-side / project-prefixed isolated deploys collide on them. Removing
# container_name is a breaking change (out of scope 2026-07-02); a future
# fresh-deploy isolation test needs an override that drops container_name and
# sets volumes to `!reset []` with project-prefixed names + remapped ports.
#
# Volume name mapping (compose key -> external name):
#   - postgres_data -> memory_postgres_data
#   - neo4j_data     -> neo4j_data
#   - neo4j_logs     -> neo4j_logs
# =============================================================================
volumes:
  # PostgreSQL data volume - pinned to existing database
  postgres_data:
    external: true
    name: memory_postgres_data

  # Neo4j volumes REMOVED 2026-07-17 — Neo4j sunset.

# =============================================================================
# Network Configuration
# =============================================================================
networks:
  knowledge-network:
    external: true
    name: knowledge-network
  open-webui-stack_default:
    external: true
    name: open-webui-stack_default
