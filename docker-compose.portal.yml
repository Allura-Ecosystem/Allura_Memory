services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: allura-human-portal
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: production
      ALLURA_DEV_AUTH_ENABLED: "false"
      ALLURA_DASHBOARD_PORT: "3200"
      POSTGRES_HOST: knowledge-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - knowledge-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e "fetch('http://localhost:3200/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  knowledge-network:
    external: true
    name: knowledge-network
