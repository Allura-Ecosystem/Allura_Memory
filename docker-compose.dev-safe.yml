# Disposable local-only database. Always invoke through scripts/dev-safe/index.ts.
name: allura-dev-safe
services:
  postgres:
    image: allura-dev-safe-postgres:local
    build:
      context: .
      dockerfile: docker/portfolio-postgres/Dockerfile
    environment:
      POSTGRES_DB: allura_dev
      POSTGRES_USER: allura
      POSTGRES_PASSWORD: allura-dev-local-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    restart: "no"
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    healthcheck:
      # TCP stays unavailable during the entrypoint's temporary init server.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "allura", "-d", "allura_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
networks:
  # Dedicated project bridge; internal:true suppresses host publication on this host.
  default: {}
