# team.yaml — Agent Team Module Manifest
# BMad-compatible team module definition
# See: bmad-code-org / Agent Skills standard

name: "${TEAM_NAME}"
description: "${TEAM_DESCRIPTION}"
version: "0.1.0"
author: "Allura Factory"

# Group ID for Allura Brain tenant isolation
group_id: "allura-${TEAM_SLUG}"

# Agent roster — each agent is a file in agents/*.md
agents:
${AGENTS_LIST}

# BMad module metadata (extends Agent Skills standard)
bmad:
  module_version: 1
  tags: ${TAGS}
  dependencies:
    - allura-memory-skill@>=0.1.0
    - bmad-core@>=0.5.0

# Installation targets
install:
  - platform: "opencode"
    config_path: ".opencode/agent/"
  - platform: "claude-code"
    config_path: ".claude/agents/"

# Variables overridden at provision time
variables:
  client_name:
    description: "Human-readable client name"
    required: true
  tenant_id:
    description: "Allura tenant identifier (allura-{name})"
    required: true
  brain_endpoint:
    description: "Allura Brain MCP endpoint"
    default: "http://localhost:5888/mcp"
