# Governance Overlay — Allura Brain Tenant
# Auto-generated from ADR v0.1 overlay template
# Applied at team provision time; DO NOT EDIT directly

group_id: "allura-${TEAM_SLUG}"

# Activation steps prepended before agent greeting
activation_steps_prepend:
  step_0_brain_hydration: |
    Scout hydration via allura-brain_memory_search
    with group_id='allura-${TEAM_SLUG}'
    and user_id='${AGENT_ID}'

  step_1_session_start: |
    allura-brain_memory_add(
      group_id="allura-${TEAM_SLUG}",
      user_id="${AGENT_ID}",
      content="session_start: ${AGENT_NAME}"
    )

# Persistent facts — injected into every agent context
persistent_facts:

  group_id_enforcement: |
    Every operation MUST include group_id matching "allura-${TEAM_SLUG}".
    No cross-tenant data access. No default group_id fallback.

  append_only: |
    PostgreSQL events are append-only. No UPDATE, no DELETE.
    Soft-delete via `deprecated` flag only.

  supersedes_versioning: |
    Neo4j nodes versioned via SUPERSEDES relationship.
    Never mutate nodes in-place. Create new version → link with SUPERSEDES.

  hitl_required: |
    Promotion from episodic (PostgreSQL) to semantic (Neo4j)
    requires human curator (Bahari) approval.

  brain_contract: |
    All memory operations use canonical MCP interface.
    Never write to databases directly. Always through Brain API.

  evidence_before_promotion: |
    No memory is promoted without supporting evidence
    linked in metadata. Low-signal entries (one-liners, noise)
    are rejected at the curator gate.

# Activation steps appended after agent loads
activation_steps_append:

  on_complete_writeback: |
    TASK_COMPLETE event logged to Brain on session end.
    Includes: outcome summary, artifacts produced, decisions made.

  reflection: |
    At session end, emit structured reflection:
    - Action taken
    - Principle applied
    - Event logged
    - Confidence level
