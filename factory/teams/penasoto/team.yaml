name: "Team Penasoto"
description: "Mortgage audit operations — loan file QC, TRID compliance, underwriting validation, investor guidelines, regulatory tracking, data privacy"
version: "0.1.0"
author: "Allura Factory"

group_id: "allura-penasoto"

agents:
  - loan-file-auditor
  - trid-compliance-checker
  - underwriting-validator
  - investor-guideline-specialist
  - qc-reporting-analyst
  - regulatory-change-tracker
  - data-privacy-officer

bmad:
  module_version: 1
  tags: ["mortgage", "audit", "compliance", "lending"]
  dependencies:
    - allura-memory-skill@>=0.1.0
    - bmad-core@>=0.5.0

install:
  - platform: "opencode"
    config_path: ".opencode/agent/"
  - platform: "claude-code"
    config_path: ".claude/agents/"

variables:
  client_name:
    description: "Mortgage lender or audit firm name"
    required: true
  tenant_id:
    description: "Allura tenant identifier"
    required: true
  brain_endpoint:
    description: "Allura Brain MCP endpoint"
    default: "http://localhost:5888/mcp"
