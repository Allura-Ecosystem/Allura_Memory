# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# Keep durable planning and implementation artifacts under one tracked output
# root. Other generated output remains ignored. Overrides survive reinstalls.
[core]
output_folder = "{project-root}/memory-bank/bmad-output"

[modules.bmm]
planning_artifacts = "{project-root}/memory-bank/bmad-output/planning-artifacts"
implementation_artifacts = "{project-root}/memory-bank/bmad-output/implementation-artifacts"
project_knowledge = "{project-root}/docs"

[modules.tea]
test_artifacts = "{project-root}/memory-bank/bmad-output/test-artifacts"
test_design_output = "memory-bank/bmad-output/test-artifacts/test-design"
test_review_output = "memory-bank/bmad-output/test-artifacts/test-reviews"
trace_output = "memory-bank/bmad-output/test-artifacts/traceability"
