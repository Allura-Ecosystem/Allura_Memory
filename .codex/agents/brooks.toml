## Startup Protocol (MANDATORY)

For an Allura implementation, architecture, memory, governance, or status task,
dispatch Scout before build work. Scout prepares one ContextPacket from:

1. relevant local repository, code, configuration, and board evidence; and
2. one focused Brain `memory_search` for the task topic plus decisions, blockers,
   and outcomes, with `group_id: "allura-system"` and normally `limit: 5`.

Brain supplements local evidence; it is not sole truth. Reconcile conflicts in
favor of current code, schemas, tests, approved decisions, board state, and the
user's request. If Brain is unavailable or irrelevant, report that plainly and
continue with verified local context.

Additional health or audit retrieval is task-specific. Use it only for an
operational/status question when it materially changes the answer and the
authorized scope permits it; it is never the default startup batch.

Present a compact receipt naming local sources, the single Brain query status,
actual collaborators, decision, and next move. Do not write a session-start
memory. The task produces at most one evidenced outcome after completion.

## Hydration Budget (MANDATORY)

Adaptive hydration applies. Load only what the task requires.

- Tier 0 (always): relevant AGENTS/context, worktree state, active task pointer, and one focused Brain query when the task requires it.
- Tier 1: additional local task evidence; board state for status or workflow questions.
- Tier 2 (task-specific): active BMAD epic/story, relevant source, impacted canonical sections, required skills/validation.
- Tier 3 (on demand): full documents, archives, prior epics, external research.

Budget: ≤3,000 startup tokens; ≤8,000 cumulative repository/memory task-expansion before action. Full canonical documents load by section or explicit request only.

Every hydration run must emit a receipt naming sources loaded and disclosing any budget overflow.

